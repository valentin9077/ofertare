{margin:0;flex:1;font-size:16px}.sheet .body{padding:14px;overflow:auto}.sheet footer{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#14243a;color:#fff;padding:10px 14px;border-radius:9px;z-index:80;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.match{display:grid;grid-template-columns:1.2fr 1fr 82px 72px 80px;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:7px}@media(max-width:820px){.match{grid-template-columns:1fr}.topbar{padding-top:calc(10px + env(safe-area-inset-top))}}.status-auto{color:var(--green);font-weight:800}.status-check{color:var(--orange);font-weight:800}.status-miss{color:var(--red);font-weight:800}.printdoc{display:none}.mini{font-size:11px}.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tabs2 button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px}.tabs2 button.active{background:var(--blue);color:#fff;border-color:var(--blue)}

{id:'sapatura',domeniu:'Diverse',cat:'Terasamente',den:'Săpătură',um:'mc',pret:95.00,tva:21,tip:'serviciu',alias:['sapatura','sapat manual','sapat mecanizat'],desc:'Săpătură la adâncime variabilă.',norm:'STAS 816'},

const DEFAULT={settings:{co:'SCV AQUA PREMIUM INSTAL SRL',slogan:'SMART SOLUTIONS FOR THE FUTURE',cif:'RO47989333',reg:'J23/2461/2023',adresa:'Str. Amurgului 43, Bl.3, Et.1, Ap.7, Popești-Leordeni, Ilfov',tel:'0737 757 673',email:'simpteavalentin@yahoo.com',iban:'RO52BTRLRONCRT0CW5784401',banca:'Banca Transilvania',tva:21,avans:30,garantieLuni:24,valabilitateZile:30,penalitati:'0,1% / zi de întârziere',modalitate:'Transfer bancar / Cash',obiect:'Montaj instalație: traseu țevi încălzire în pardoseală, instalații sanitare, termice și canalizare interioară. Execuție conform normativelor tehnice în vigoare de către personal specializat.',excluderi:['Rețele exterioare: fosă septică, puț forat, branșament apă rece și gaz natural','Materiale sanitare și termice: robineți, radiatoare, obiecte sanitare, centrală termică, pompe de căldură','Lucrări de construcție, desfacere și refacere finisaje','Probe și certificări oficiale impuse de autorități — dacă sunt solicitate','Proiectare tehnică, verificare proiect și diriginție de șantier']},beneficiari:[],catalog:seedCatalog,oferte:[],proiecte:[],garantii:[],interventii:[],cheltuieli:[],pontaj:[],salarii:[]};
const LSKEY='scv.aqua.manager.v2';let S=load();let tab='dashboard';
function load(){try{return Object.assign(structuredClone(DEFAULT),JSON.parse(localStorage.getItem(LSKEY)||'{}'))}catch(e){return structuredClone(DEFAULT)}}
function save(){localStorage.setItem(LSKEY,JSON.stringify(S))}function id(){return Math.random().toString(36).slice(2,10)}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function n(x){return Number(String(x??0).replace(',','.'))||0}function fmt(x){return n(x).toLocaleString('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2})}function ron(x){return fmt(x)+' RON'}
function today(){return new Date().toISOString().slice(0,10)}function rodate(s){if(!s)return'';const d=new Date(s);return isNaN(d)?s:d.toLocaleDateString('ro-RO')}function addDays(s,days){const d=s?new Date(s):new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}function addMonths(s,m){const d=s?new Date(s):new Date();d.setMonth(d.getMonth()+m);return d.toISOString().slice(0,10)}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[ø”"']/g,' ').replace(/[^a-z0-9\/ ]/g,' ').replace(/\s+/g,' ').trim()}function dims(s){const t=' '+norm(s)+' ';const out=new Set();[['1 1/2','d40'],['1 1/4','d32'],['2 1/2','d65'],['1/2','d15'],['3/4','d20'],['5/4','d32'],['6/4','d40']].forEach(([a,b])=>{if(t.includes(' '+a+' '))out.add(b)});(t.match(/\b(?:dn|de|d)\s?(\d{2,3})\b/g)||[]).forEach(m=>out.add('d'+m.replace(/\D/g,'')));return out}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
function nav(){const tabs=[['dashboard','Dashboard'],['beneficiari','Beneficiari'],['catalog','Catalog manoperă'],['oferte','Oferte'],['proiecte','Proiecte'],['garantii','Garanții'],['cheltuieli','Cheltuieli'],['pontaj','Pontaj'],['salarii','Salarii'],['setari','Setări']];document.getElementById('nav').innerHTML=tabs.map(([k,l])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('')}function go(k){tab=k;render()}
function render(){nav();const a=document.getElementById('app');a.innerHTML=({dashboard:rDashboard,beneficiari:rBeneficiari,catalog:rCatalog,oferte:rOferte,proiecte:rProiecte,garantii:rGarantii,cheltuieli:rCheltuieli,pontaj:rPontaj,salarii:rSalarii,setari:rSetari}[tab]||rDashboard)(); if(tab==='beneficiari') setTimeout(renderBenefList); if(tab==='catalog') setTimeout(renderCatalogList)}
function kpi(icon,label,val){return `<div class="card kpi"><div class="ico">${icon}</div><div><b>${val}</b><span>${label}</span></div></div>`}
function offerTotal(o){const sub=(o.rows||[]).filter(r=>r.inclus!==false).reduce((s,r)=>s+n(r.cant)*n(r.pret),0);const tva=sub*n(o.tva??S.settings.tva)/100;return{sub,tva,total:sub+tva}}
function projectValue(p){return offerTotal({rows:p.rows||[],tva:S.settings.tva}).total}function expensesFor(pid){return S.cheltuieli.filter(e=>e.proiectId===pid).reduce((s,e)=>s+n(e.valoare),0)}
function warrantyStatus(g){const left=Math.ceil((new Date(g.expira)-new Date())/86400000);if(left<0)return['expirată','bad',left];if(left<=30)return['expiră curând','warn',left];return['activă','ok',left]}
function notifications(){let out=[];S.garantii.forEach(g=>{const [st,cls,left]=warrantyStatus(g);if(left===90||left===30||left===7||left===0||left<0||left<=30)out.push({txt:`Garanția ${g.beneficiar} — ${g.santier||''} ${left<0?'a expirat':left===0?'expiră azi':'expiră în '+left+' zile'}`,cls})});return out}
function rDashboard(){const exp=S.cheltuieli.reduce((s,e)=>s+n(e.valoare),0);const val=S.proiecte.reduce((s,p)=>s+projectValue(p),0);const profit=val-exp;const ns=notifications();return `<div class="grid g4">${kpi('📄','total oferte',S.oferte.length)}${kpi('🏗️','proiecte',S.proiecte.length)}${kpi('🛡️','garanții active',S.garantii.filter(g=>warrantyStatus(g)[1]!=='bad').length)}${kpi('💰','profit proiecte',ron(profit))}</div><div class="grid g2" style="margin-top:12px"><div class="card"><h2 class="title">Notificări</h2>${ns.length?ns.map(x=>`<div class="row" style="border-bottom:1px solid #edf1f5;padding:7px 0"><span class="pill ${x.cls}">${x.cls==='bad'?'expirată':'garanție'}</span><span>${esc(x.txt)}</span></div>`).join(''):'<div class="empty">Nu sunt notificări.</div>'}</div><div class="card"><h2 class="title">Rezumat financiar</h2><table><tr><td>Valoare contracte</td><td class="num"><b>${ron(val)}</b></td></tr><tr><td>Cheltuieli</td><td class="num"><b>${ron(exp)}</b></td></tr><tr><td>Profit estimat / real</td><td class="num"><b>${ron(profit)}</b></td></tr></table></div></div><div class="card" style="margin-top:12px"><h2 class="title">Flux recomandat</h2><div class="row"><span class="pill">1 Beneficiar+CUI</span><span>→</span><span class="pill">2 Import listă</span><span>→</span><span class="pill">3 Ciornă editabilă</span><span>→</span><span class="pill">4 PDF ofertă</span><span>→</span><span class="pill">5 Proiect</span><span>→</span><span class="pill">6 Garanție</span></div></div>`}
function rBeneficiari(){return `<div class="row"><h2 class="title">Beneficiari cu CUI</h2><span class="spacer"></span><button class="btn" onclick="editBenef()">+ Beneficiar</button></div><input class="search" id="bq" oninput="renderBenefList()" placeholder="Caută beneficiar, CUI, șantier..."><div id="blist"></div>`}
function renderBenefList(){const q=norm(document.getElementById('bq')?.value||'');const list=S.beneficiari.filter(b=>!q||norm([b.firma,b.cui,b.reg,b.adresa,b.santier,b.contact].join(' ')).includes(q));document.getElementById('blist').innerHTML=list.length?`<div class="tablewrap"><table><thead><tr><th>Firmă</th><th>CUI</th><th>Contact</th><th>Șantier</th><th>Istoric</th><th></th></tr></thead><tbody>${list.map(b=>`<tr><td><b>${esc(b.firma)}</b><div class="muted">${esc(b.adresa)}</div></td><td>${esc(b.cui)}<div class="muted">${esc(b.reg)}</div></td><td>${esc(b.contact)}<div class="muted">${esc(b.tel)} ${esc(b.email)}</div></td><td>${esc(b.santier||'')}</td><td><span class="pill">${S.oferte.filter(o=>o.beneficiarId===b.id).length} oferte</span> <span class="pill ok">${S.proiecte.filter(p=>p.beneficiarId===b.id).length} proiecte</span></td><td class="actions"><button class="btn sm sec" onclick="newOffer('${b.id}')">Ofertă</button> <button class="btn sm gray" onclick="editBenef('${b.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nu ai beneficiari încă.</div>'}
function editBenef(bid){const b=bid?S.beneficiari.find(x=>x.id===bid):{id:id(),firma:'',cui:'',reg:'',adresa:'',tel:'',email:'',contact:'',santier:''};openModal(bid?'Editează beneficiar':'Beneficiar nou',`<div class="grid g2"><div class="field"><label>CUI</label><input id="bf-cui" value="${esc(b.cui)}" placeholder="RO... / CUI"></div><div class="field"><label>Denumire firmă</label><input id="bf-firma" value="${esc(b.firma)}"></div><div class="field"><label>Reg. Com.</label><input id="bf-reg" value="${esc(b.reg)}"></div><div class="field"><label>Persoană contact</label><input id="bf-contact" value="${esc(b.contact)}"></div><div class="field"><label>Telefon</label><input id="bf-tel" value="${esc(b.tel)}"></div><div class="field"><label>Email</label><input id="bf-email" value="${esc(b.email)}"></div></div><div class="field"><label>Adresă beneficiar</label><input id="bf-adresa" value="${esc(b.adresa)}"></div><div class="field"><label>Șantier / amplasament</label><input id="bf-santier" value="${esc(b.santier)}"></div><div class="muted">Completarea automată după CUI se poate lega ulterior la un API ANAF/SmartBill. În MVP, dacă firma există deja în istoric, aplicația reutilizează datele salvate.</div>`,[{label:'Salvează',cls:'',fn:()=>{['cui','firma','reg','contact','tel','email','adresa','santier'].forEach(k=>b[k]=document.getElementById('bf-'+k).value.trim());if(!b.firma){toast('Completează denumirea firmei');return}if(!bid)S.beneficiari.push(b);save();closeModal();render();toast('Beneficiar salvat')}}])}
function rCatalog(){return `<div class="row"><h2 class="title">Catalog manoperă</h2><span class="pill">${S.catalog.length} produse</span><span class="spacer"></span><button class="btn sec" onclick="exportCatalog()">CSV</button><button class="btn" onclick="editProd()">+ Produs</button></div><input class="search" id="cq" oninput="renderCatalogList()" placeholder="Caută: PPR, DN200, hidrant, robinet..."><div id="clist"></div>`}
function renderCatalogList(){const q=norm(document.getElementById('cq')?.value||'');const list=S.catalog.filter(a=>!q||norm([a.den,a.cat,a.domeniu,a.desc,(a.alias||[]).join(' ')].join(' ')).includes(q)).slice(0,600);document.getElementById('clist').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Domeniu</th><th>Denumire / descriere</th><th>UM</th><th class="num">Preț fără TVA</th><th class="num">Cu TVA</th><th>Tip</th><th></th></tr></thead><tbody>${list.map(a=>`<tr><td>${esc(a.domeniu)}<div class="muted">${esc(a.cat||'')}</div></td><td><b>${esc(a.den)}</b><div class="muted">${esc(a.desc||'')}</div><div class="mini">Normativ: ${esc(a.norm||'-')}</div></td><td>${esc(a.um)}</td><td class="num">${ron(a.pret)}</td><td class="num">${ron(n(a.pret)*(1+n(a.tva??TVA)/100))}</td><td>${esc(a.tip||'')}</td><td><button class="btn sm gray" onclick="editProd('${a.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`}
function editProd(pid){const a=pid?S.catalog.find(x=>x.id===pid):{id:id(),domeniu:DOMENII[0],cat:'',den:'',um:'buc',pret:0,tva:S.settings.tva,tip:'componentă',alias:[],desc:'',norm:''};openModal(pid?'Editează produs':'Produs nou',`<div class="grid g2"><div class="field"><label>Domeniu</label><select id="pf-domeniu">${DOMENII.map(d=>`<option ${a.domeniu===d?'selected':''}>${esc(d)}</option>`).join('')}</select></div><div class="field"><label>Categorie / subcategorie</label><input id="pf-cat" value="${esc(a.cat)}"></div><div class="field"><label>Denumire internă</label><input id="pf-den" value="${esc(a.den)}"></div><div class="field"><label>UM</label><input id="pf-um" value="${esc(a.um)}"></div><div class="field"><label>Preț fără TVA</label><input id="pf-pret" type="number" step="any" value="${esc(a.pret)}"></div><div class="field"><label>TVA %</label><input id="pf-tva" type="number" step="any" value="${esc(a.tva??S.settings.tva)}"></div><div class="field"><label>Tip</label><select id="pf-tip"><option>componentă</option><option>pachet</option><option>serviciu</option></select></div><div class="field"><label>Normativ</label><input id="pf-norm" value="${esc(a.norm||'')}"></div></div><div class="field"><label>Aliasuri / sinonime, separate prin virgulă</label><input id="pf-alias" value="${esc((a.alias||[]).join(', '))}"></div><div class="field"><label>Descriere tehnică</label><textarea id="pf-desc">${esc(a.desc||'')}</textarea></div>`,[{label:'Salvează',cls:'',fn:()=>{['domeniu','cat','den','um','tip','norm','desc'].forEach(k=>a[k]=document.getElementById('pf-'+k).value.trim());a.pret=n(document.getElementById('pf-pret').value);a.tva=n(document.getElementById('pf-tva').value);a.alias=document.getElementById('pf-alias').value.split(',').map(x=>norm(x)).filter(Boolean);if(!a.den){toast('Completează denumirea');return}if(!pid)S.catalog.push(a);save();closeModal();render();toast('Produs salvat')}},pid?{label:'Șterge',cls:'danger',fn:()=>{S.catalog=S.catalog.filter(x=>x.id!==pid);save();closeModal();render()}}:null].filter(Boolean))}
function rOferte(){return `<div class="row"><h2 class="title">Oferte</h2><span class="spacer"></span><button class="btn" onclick="newOffer()">+ Ofertă nouă</button></div>${S.oferte.length?`<div class="tablewrap"><table><thead><tr><th>Ofertă</th><th>Beneficiar</th><th>Status</th><th class="num">Total cu TVA</th><th></th></tr></thead><tbody>${S.oferte.slice().reverse().map(o=>`<tr><td><b>${esc(o.nr)}</b><div class="muted">${rodate(o.data)} · valabilă până la ${rodate(o.valabilitate)}</div></td><td>${esc(o.beneficiar)}<div class="muted">${esc(o.santier||'')}</div></td><td><span class="pill ${o.status==='acceptată'?'ok':'warn'}">${esc(o.status||'ciornă')}</span></td><td class="num"><b>${ron(offerTotal(o).total)}</b></td><td class="actions"><button class="btn sm" onclick="editOffer('${o.id}')">Deschide</button> <button class="btn sm sec" onclick="printOffer('${o.id}')">PDF</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nu ai oferte încă.</div>'}`}
function newOffer(bid){const b=bid?S.beneficiari.find(x=>x.id===bid):S.beneficiari[0];const nr=`${new Date().getFullYear()}/${String(S.oferte.length+1).padStart(3,'0')}`;const o={id:id(),nr,data:today(),valabilitate:addDays(today(),n(S.settings.valabilitateZile)||30),beneficiarId:b?.id||'',beneficiar:b?.firma||'',cui:b?.cui||'',adresa:b?.adresa||'',santier:b?.santier||'',contact:b?.contact||'',obiect:S.settings.obiect,tva:S.settings.tva,avans:S.settings.avans,status:'ciornă',rows:[]};S.oferte.push(o);save();editOffer(o.id)}
function editOffer(oid){const o=S.oferte.find(x=>x.id===oid);const t=offerTotal(o);openModal('Ofertă '+o.nr,offerForm(o,t),[{label:'Închide',cls:'gray',fn:()=>{closeModal();render()}},{label:'Export CSV',cls:'sec',fn:()=>exportOfferCSV(o.id)},{label:'PDF ofertă',cls:'sec',fn:()=>printOffer(o.id)},{label:'Acceptă → Proiect',cls:'',fn:()=>acceptOffer(o.id)}],true);bindOffer(o.id)}
function offerForm(o,t){return `<div class="tabs2"><button onclick="offerSubtab('${o.id}','date')" id="ot-date" class="active">Date</button><button onclick="offerSubtab('${o.id}','import')" id="ot-import">Import listă</button><button onclick="offerSubtab('${o.id}','draft')" id="ot-draft">Ciornă editabilă</button><button onclick="offerSubtab('${o.id}','total')" id="ot-total">Totaluri</button></div><div id="offerPane"></div>`}
function bindOffer(oid){offerSubtab(oid,'date')}
function offerSubtab(oid,k){document.querySelectorAll('.tabs2 button').forEach(b=>b.classList.remove('active'));document.getElementById('ot-'+k)?.classList.add('active');const o=S.oferte.find(x=>x.id===oid);const p=document.getElementById('offerPane');if(k==='date'){p.innerHTML=`<div class="grid g2"><div class="field"><label>Nr. ofertă</label><input id="of-nr" value="${esc(o.nr)}"></div><div class="field"><label>Data</label><input id="of-data" type="date" value="${esc(o.data)}"></div><div class="field"><label>Beneficiar</label><select id="of-benef" onchange="fillBenef('${oid}',this.value)"><option value="">manual</option>${S.beneficiari.map(b=>`<option value="${b.id}" ${o.beneficiarId===b.id?'selected':''}>${esc(b.firma)} — ${esc(b.cui)}</option>`).join('')}</select></div><div class="field"><label>Valabilitate</label><input id="of-val" type="date" value="${esc(o.valabilitate)}"></div></div><div class="grid g2"><div class="field"><label>Firmă beneficiar</label><input id="of-beneficiar" value="${esc(o.beneficiar)}"></div><div class="field"><label>CUI</label><input id="of-cui" value="${esc(o.cui||'')}"></div></div><div class="field"><label>Adresă / șantier</label><input id="of-santier" value="${esc(o.santier||o.adresa||'')}"></div><div class="field"><label>Obiectul ofertei</label><textarea id="of-obiect">${esc(o.obiect)}</textarea></div><div class="grid g2"><div class="field"><label>Avans %</label><input id="of-avans" type="number" value="${esc(o.avans)}"></div><div class="field"><label>TVA %</label><input id="of-tva" type="number" value="${esc(o.tva)}"></div></div><button class="btn" onclick="saveOfferFields('${oid}')">Salvează date</button>`}if(k==='import'){p.innerHTML=`<div class="grid g2"><div class="card"><h3 class="subtitle">Import fișier</h3><p class="muted">Acceptă Excel, CSV sau TXT. Pentru PDF/poză/WhatsApp, copiază textul în zona din dreapta sau folosește OCR pe telefon, apoi lipește rezultatul.</p><button class="btn" onclick="importFile('${oid}')">Alege fișier</button></div><div class="card"><h3 class="subtitle">Text / WhatsApp</h3><textarea id="imptext" style="min-height:160px" placeholder="Ex: Teava PP-R De63 | ml | 45"></textarea><button class="btn" style="margin-top:8px" onclick="importText('${oid}')">Potrivește cu catalogul</button></div></div>`}if(k==='draft'){renderDraft(o)}if(k==='total'){const t=offerTotal(o);p.innerHTML=`<div class="grid g3">${kpi('∑','Subtotal fără TVA',ron(t.sub))}${kpi('TVA','TVA '+o.tva+'%',ron(t.tva))}${kpi('=','Total cu TVA',ron(t.total))}</div><div class="card" style="margin-top:12px"><h3 class="subtitle">Condiții plată</h3><table><tr><td>Avans ${o.avans}%</td><td class="num"><b>${ron(t.total*n(o.avans)/100)}</b></td></tr><tr><td>Rest ${100-n(o.avans)}%</td><td class="num"><b>${ron(t.total*(100-n(o.avans))/100)}</b></td></tr><tr><td>Modalitate plată</td><td>${esc(S.settings.modalitate)}</td></tr><tr><td>Penalități</td><td>${esc(S.settings.penalitati)}</td></tr></table></div>`}}
function saveOfferFields(oid){const o=S.oferte.find(x=>x.id===oid);['nr','data','val','beneficiar','cui','santier','obiect','avans','tva'].forEach(k=>{const el=document.getElementById('of-'+k);if(el)o[k==='val'?'valabilitate':k]=el.type==='number'?n(el.value):el.value});save();toast('Ofertă salvată')}
function fillBenef(oid,bid){const o=S.oferte.find(x=>x.id===oid),b=S.beneficiari.find(x=>x.id===bid);if(!b)return;o.beneficiarId=b.id;o.beneficiar=b.firma;o.cui=b.cui;o.adresa=b.adresa;o.santier=b.santier;o.contact=b.contact;save();offerSubtab(oid,'date')}
function renderDraft(o){const p=document.getElementById('offerPane');const rows=o.rows||[];p.innerHTML=`<div class="row"><button class="btn sec sm" onclick="addManualRow('${o.id}')">+ Rând manual</button><span class="muted">${rows.length} rânduri</span></div><div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Domeniu</th><th>Denumire beneficiar / produs intern</th><th>UM</th><th class="num">Cant.</th><th class="num">Preț</th><th class="num">Total</th><th>Status</th><th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><select onchange="updRow('${o.id}',${i},'domeniu',this.value)">${DOMENII.map(d=>`<option ${r.domeniu===d?'selected':''}>${esc(d)}</option>`).join('')}</select></td><td><input value="${esc(r.den)}" onchange="updRow('${o.id}',${i},'den',this.value)"><div class="muted">Intern: <input value="${esc(r.produs||'')}" onchange="updRow('${o.id}',${i},'produs',this.value)" style="width:70%"></div></td><td><input style="width:60px" value="${esc(r.um)}" onchange="updRow('${o.id}',${i},'um',this.value)"></td><td class="num"><input type="number" step="any" value="${esc(r.cant)}" onchange="updRow('${o.id}',${i},'cant',this.value)" style="width:75px"></td><td class="num"><input type="number" step="any" value="${esc(r.pret)}" onchange="updRow('${o.id}',${i},'pret',this.value)" style="width:85px"></td><td class="num"><b>${ron(n(r.cant)*n(r.pret))}</b></td><td><span class="${r.status==='potrivit automat'?'status-auto':r.status==='necesită verificare'?'status-check':'status-miss'}">${esc(r.status||'manual')}</span><div class="mini">${Math.round(n(r.scor)*100)}%</div></td><td><button class="btn sm gray" onclick="chooseMatch('${o.id}',${i})">Potrivește</button> <button class="btn sm danger" onclick="delRow('${o.id}',${i})">✕</button></td></tr>`).join('')}</tbody></table></div>`}
function updRow(oid,i,k,v){const r=S.oferte.find(x=>x.id===oid).rows[i];r[k]=(k==='cant'||k==='pret')?n(v):v;save();offerSubtab(oid,'draft')}function delRow(oid,i){S.oferte.find(x=>x.id===oid).rows.splice(i,1);save();offerSubtab(oid,'draft')}function addManualRow(oid){S.oferte.find(x=>x.id===oid).rows.push({id:id(),domeniu:'Diverse',den:'',produs:'',um:'buc',cant:1,pret:0,status:'adăugat manual',scor:0,inclus:true});save();offerSubtab(oid,'draft')}
function scoreMatch(text){const nt=new Set(norm(text).split(' ').filter(w=>w.length>2));const dt=dims(text);return S.catalog.map(a=>{if((a.alias||[]).includes(norm(text)))return{a,score:1};const at=new Set(norm([a.den,a.desc,a.cat,a.domeniu].join(' ')).split(' ').filter(w=>w.length>2));let inter=0;nt.forEach(w=>{if(at.has(w))inter++});const jac=inter/(nt.size+at.size-inter||1);const ad=dims(a.den+' '+a.desc);let dim=0;dt.forEach(d=>{if(ad.has(d))dim=1});return{a,score:jac+dim*.35-(dt.size&&ad.size&&!dim?.25:0)}}).sort((x,y)=>y.score-x.score).slice(0,5)}
function rowFromText(den,um,cant){const m=scoreMatch(den)[0];return{id:id(),domeniu:m?.a.domeniu||'Diverse',den,produs:m?.a.den||'',um:um||m?.a.um||'buc',cant:n(cant)||1,pret:m?.a.pret||0,status:m?(m.score>.55?'potrivit automat':'necesită verificare'):'lipsă catalog',scor:m?.score||0,catalogId:m?.a.id||null,inclus:true}}
function chooseMatch(oid,i){const o=S.oferte.find(x=>x.id===oid),r=o.rows[i],ms=scoreMatch(r.den);openModal('Potrivire produs',ms.map((m,k)=>`<div class="match"><div><b>${esc(r.den)}</b><div class="muted">rând beneficiar</div></div><div><b>${esc(m.a.den)}</b><div class="muted">${esc(m.a.domeniu)} · ${esc(m.a.um)} · ${ron(m.a.pret)}</div></div><div><span class="pill ${m.score>.55?'ok':'warn'}">${Math.round(m.score*100)}%</span></div><div><button class="btn sm" onclick="applyMatch('${oid}',${i},'${m.a.id}')">Alege</button></div></div>`).join('')||'<div class="empty">Nu există potrivire.</div>',[{label:'Închide',cls:'gray',fn:()=>{closeModal();offerSubtab(oid,'draft')}}])}
function applyMatch(oid,i,pid){const a=S.catalog.find(x=>x.id===pid),r=S.oferte.find(x=>x.id===oid).rows[i];r.produs=a.den;r.pret=a.pret;r.um=r.um||a.um;r.domeniu=a.domeniu;r.catalogId=a.id;r.status='potrivit automat';r.scor=1;a.alias=a.alias||[];const al=norm(r.den);if(!a.alias.includes(al))a.alias.push(al);save();closeModal();offerSubtab(oid,'draft');toast('Potrivire salvată')}
function importText(oid){const txt=document.getElementById('imptext').value;applyRows(oid,parseLines(txt));offerSubtab(oid,'draft')}function importFile(oid){const f=document.getElementById('file');f.onchange=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=ev=>{let rows=[];try{if(file.name.match(/\.xlsx?$/i)&&window.XLSX){const wb=XLSX.read(ev.target.result,{type:'array'});const sh=wb.Sheets[wb.SheetNames[0]];rows=parseArray(XLSX.utils.sheet_to_json(sh,{header:1,defval:''}))}else rows=parseLines(ev.target.result)}catch(err){alert('Nu pot citi fișierul: '+err.message)}applyRows(oid,rows);offerSubtab(oid,'draft')};file.name.match(/\.xlsx?$/i)?rd.readAsArrayBuffer(file):rd.readAsText(file)};f.value='';f.click()}
function parseLines(txt){return String(txt||'').split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/[;\t|]/).map(x=>x.trim());if(p.length>=3)return{den:p[0],um:p[1],cant:p[2]};const m=l.match(/(.+?)\s+(buc|ml|m|mc|mp|ans|tona)\s+([\d,.]+)/i);return m?{den:m[1],um:m[2],cant:m[3]}:{den:l,um:'buc',cant:1}})}
function parseArray(arr){let head=0,cden=0,cum=-1,ccant=-1;for(let i=0;i<Math.min(arr.length,20);i++){arr[i].forEach((v,j)=>{const x=norm(v);if(/denumire|descriere|lucrare|articol|capitol/.test(x)){head=i;cden=j}if(/^u m$|^um$|unitate/.test(x))cum=j;if(/cant/.test(x))ccant=j})}return arr.slice(head+1).map(r=>({den:String(r[cden]||'').trim(),um:cum>=0?String(r[cum]||'').trim():'buc',cant:ccant>=0?r[ccant]:1})).filter(x=>x.den.length>3&&!/^total|subtotal/i.test(x.den))}
function applyRows(oid,rows){const o=S.oferte.find(x=>x.id===oid);rows.forEach(x=>o.rows.push(rowFromText(x.den,x.um,x.cant)));save();toast(rows.length+' rânduri importate')}
function acceptOffer(oid){const o=S.oferte.find(x=>x.id===oid);if(!o.rows.length){toast('Oferta nu are rânduri');return}o.status='acceptată';const p={id:id(),ofertaId:o.id,nr:o.nr,beneficiarId:o.beneficiarId,beneficiar:o.beneficiar,santier:o.santier,dataStart:today(),status:'în lucru',rows:o.rows.map(r=>({...r,contractat:n(r.cant),executatAnterior:0,executatAcum:0})),observatii:''};S.proiecte.push(p);save();closeModal();go('proiecte');toast('Oferta a devenit proiect')}
function rProiecte(){return `<div class="row"><h2 class="title">Proiecte</h2></div>${S.proiecte.length?`<div class="tablewrap"><table><thead><tr><th>Proiect</th><th>Status</th><th class="num">Contract</th><th class="num">Cheltuieli</th><th class="num">Profit</th><th></th></tr></thead><tbody>${S.proiecte.map(p=>{const val=projectValue(p),ex=expensesFor(p.id);return`<tr><td><b>${esc(p.beneficiar)}</b><div class="muted">Oferta ${esc(p.nr)} · ${esc(p.santier||'')}</div></td><td><span class="pill ${p.status==='finalizat'?'ok':'warn'}">${esc(p.status)}</span></td><td class="num">${ron(val)}</td><td class="num">${ron(ex)}</td><td class="num"><b>${ron(val-ex)}</b></td><td><button class="btn sm" onclick="editProject('${p.id}')">Situații</button> <button class="btn sm sec" onclick="finishProject('${p.id}')">Recepție/Garanție</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Proiectele apar după acceptarea unei oferte.</div>'}`}
function editProject(pid){const p=S.proiecte.find(x=>x.id===pid);openModal('Situație lucrări — '+p.beneficiar,`<div class="tablewrap"><table><thead><tr><th>Lucrare</th><th>UM</th><th class="num">Contractat</th><th class="num">Decontat anterior</th><th class="num">Executat acum</th><th class="num">Rămas</th><th class="num">Valoare acum</th></tr></thead><tbody>${p.rows.map((r,i)=>{const ramas=n(r.contractat)-n(r.executatAnterior)-n(r.executatAcum);return`<tr><td>${esc(r.produs||r.den)}</td><td>${esc(r.um)}</td><td class="num">${fmt(r.contractat)}</td><td class="num"><input style="width:80px" type="number" step="any" value="${esc(r.executatAnterior)}" onchange="updProj('${pid}',${i},'executatAnterior',this.value)"></td><td class="num"><input style="width:80px" type="number" step="any" value="${esc(r.executatAcum)}" onchange="updProj('${pid}',${i},'executatAcum',this.value)"></td><td class="num">${fmt(ramas)}</td><td class="num"><b>${ron(n(r.executatAcum)*n(r.pret)*(1+S.settings.tva/100))}</b></td></tr>`}).join('')}</tbody></table></div>`,[{label:'Închide',cls:'gray',fn:()=>{closeModal();render()}}])}
function updProj(pid,i,k,v){S.proiecte.find(x=>x.id===pid).rows[i][k]=n(v);save();editProject(pid)}
function finishProject(pid){const p=S.proiecte.find(x=>x.id===pid);openModal('Finalizare proiect',`<div class="field"><label>Data recepției</label><input id="rec-date" type="date" value="${today()}"></div><div class="field"><label>Durată garanție luni</label><input id="rec-luni" type="number" value="${S.settings.garantieLuni}"></div><div class="field"><label>Observații</label><textarea id="rec-obs"></textarea></div>`,[{label:'Creează garanția',cls:'',fn:()=>{const d=document.getElementById('rec-date').value,l=n(document.getElementById('rec-luni').value)||24;p.status='finalizat';S.garantii.push({id:id(),proiectId:p.id,beneficiar:p.beneficiar,santier:p.santier,contract:p.nr,receptie:d,luni:l,expira:addMonths(d,l),obs:document.getElementById('rec-obs').value});save();closeModal();go('garantii');toast('Garanție creată automat')}}])}
function rGarantii(){return `<div class="row"><h2 class="title">Garanții</h2><span class="spacer"></span><button class="btn" onclick="manualWarranty()">+ Garanție</button></div>${S.garantii.length?`<div class="tablewrap"><table><thead><tr><th>Beneficiar / șantier</th><th>Contract</th><th>Recepție</th><th>Expirare</th><th>Status</th><th>Intervenții</th><th></th></tr></thead><tbody>${S.garantii.map(g=>{const [st,cls,left]=warrantyStatus(g);return`<tr><td><b>${esc(g.beneficiar)}</b><div class="muted">${esc(g.santier||'')}</div></td><td>${esc(g.contract)}</td><td>${rodate(g.receptie)}</td><td><b>${rodate(g.expira)}</b><div class="muted">${left>=0?left+' zile rămase':Math.abs(left)+' zile trecut'}</div></td><td><span class="pill ${cls}">${st}</span></td><td>${S.interventii.filter(i=>i.garantieId===g.id).length}</td><td><button class="btn sm" onclick="addIntervention('${g.id}')">Intervenție</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Garanțiile se creează automat la recepția proiectului.</div>'}<div class="card" style="margin-top:12px"><h3 class="subtitle">Reguli notificări</h3><span class="pill">90 zile</span> <span class="pill">30 zile</span> <span class="pill">7 zile</span> <span class="pill">ziua expirării</span></div>`}
function manualWarranty(){openModal('Garanție manuală',`<div class="grid g2"><div class="field"><label>Beneficiar</label><input id="gw-ben"></div><div class="field"><label>Șantier</label><input id="gw-san"></div><div class="field"><label>Contract/ofertă</label><input id="gw-con"></div><div class="field"><label>Data recepției</label><input id="gw-rec" type="date" value="${today()}"></div><div class="field"><label>Luni garanție</label><input id="gw-luni" type="number" value="24"></div></div>`,[{label:'Salvează',cls:'',fn:()=>{const d=document.getElementById('gw-rec').value,l=n(document.getElementById('gw-luni').value)||24;S.garantii.push({id:id(),beneficiar:val('gw-ben'),santier:val('gw-san'),contract:val('gw-con'),receptie:d,luni:l,expira:addMonths(d,l)});save();closeModal();render()}}])}
function addIntervention(gid){const g=S.garantii.find(x=>x.id===gid);openModal('Intervenție garanție',`<div class="field"><label>Data sesizării</label><input id="iv-data" type="date" value="${today()}"></div><div class="field"><label>Problemă</label><textarea id="iv-prob"></textarea></div><div class="grid g2"><div class="field"><label>Angajat trimis</label><input id="iv-ang"></div><div class="field"><label>Cost</label><input id="iv-cost" type="number" step="any" value="0"></div></div><div class="field"><label>Status</label><select id="iv-status"><option>nerezolvat</option><option>rezolvat</option></select></div>`,[{label:'Salvează',cls:'',fn:()=>{S.interventii.push({id:id(),garantieId:gid,beneficiar:g.beneficiar,data:val('iv-data'),problema:val('iv-prob'),angajat:val('iv-ang'),cost:n(val('iv-cost')),status:val('iv-status')});if(n(val('iv-cost'))>0)S.cheltuieli.push({id:id(),data:val('iv-data'),proiectId:g.proiectId||'',tip:'intervenție garanție',descriere:g.beneficiar+' - '+val('iv-prob'),valoare:n(val('iv-cost'))});save();closeModal();render()}}])}
function rCheltuieli(){return `<div class="row"><h2 class="title">Cheltuieli</h2><span class="spacer"></span><button class="btn" onclick="editExpense()">+ Cheltuială</button></div>${S.cheltuieli.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Proiect</th><th>Tip</th><th>Descriere</th><th class="num">Valoare</th><th></th></tr></thead><tbody>${S.cheltuieli.slice().reverse().map(e=>`<tr><td>${rodate(e.data)}</td><td>${esc(S.proiecte.find(p=>p.id===e.proiectId)?.beneficiar||'Firmă')}</td><td>${esc(e.tip)}</td><td>${esc(e.descriere)}</td><td class="num"><b>${ron(e.valoare)}</b></td><td><button class="btn sm gray" onclick="editExpense('${e.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nu există cheltuieli introduse.</div>'}`}
function editExpense(eid){const e=eid?S.cheltuieli.find(x=>x.id===eid):{id:id(),data:today(),proiectId:'',tip:'materiale',descriere:'',valoare:0};openModal(eid?'Edit cheltuială':'Cheltuială nouă',`<div class="grid g2"><div class="field"><label>Data</label><input id="ex-data" type="date" value="${esc(e.data)}"></div><div class="field"><label>Proiect</label><select id="ex-proiectId"><option value="">Firmă / general</option>${S.proiecte.map(p=>`<option value="${p.id}" ${e.proiectId===p.id?'selected':''}>${esc(p.beneficiar)} - ${esc(p.nr)}</option>`).join('')}</select></div><div class="field"><label>Tip</label><select id="ex-tip"><option>materiale</option><option>manoperă</option><option>bon</option><option>transport</option><option>intervenție garanție</option><option>alte costuri</option></select></div><div class="field"><label>Valoare</label><input id="ex-valoare" type="number" step="any" value="${esc(e.valoare)}"></div></div><div class="field"><label>Descriere</label><input id="ex-descriere" value="${esc(e.descriere)}"></div>`,[{label:'Salvează',cls:'',fn:()=>{['data','proiectId','tip','descriere'].forEach(k=>e[k]=val('ex-'+k));e.valoare=n(val('ex-valoare'));if(!eid)S.cheltuieli.push(e);save();closeModal();render()}}])}
function rPontaj(){return `<div class="row"><h2 class="title">Pontaj importat</h2><span class="spacer"></span><button class="btn sec" onclick="importPontaj()">Import CSV</button><button class="btn" onclick="editPontaj()">+ Pontaj</button></div><div class="card"><p class="muted">Import CSV recomandat: angajat,data,zile,locație,status. Aplicația nu reface GPS; doar preia datele exportate din pontajul existent.</p></div>${S.pontaj.length?`<div class="tablewrap"><table><thead><tr><th>Angajat</th><th>Data</th><th class="num">Zile</th><th>Locație</th><th>Status</th></tr></thead><tbody>${S.pontaj.slice().reverse().map(p=>`<tr><td>${esc(p.angajat)}</td><td>${rodate(p.data)}</td><td class="num">${fmt(p.zile)}</td><td>${esc(p.locatie)}</td><td>${esc(p.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nu există pontaj importat.</div>'}`}
function editPontaj(){openModal('Pontaj',`<div class="grid g2"><div class="field"><label>Angajat</label><input id="po-angajat"></div><div class="field"><label>Data</label><input id="po-data" type="date" value="${today()}"></div><div class="field"><label>Zile</label><input id="po-zile" type="number" step="any" value="1"></div><div class="field"><label>Locație</label><input id="po-locatie"></div><div class="field"><label>Status</label><input id="po-status" value="prezent"></div></div>`,[{label:'Salvează',cls:'',fn:()=>{S.pontaj.push({id:id(),angajat:val('po-angajat'),data:val('po-data'),zile:n(val('po-zile')),locatie:val('po-locatie'),status:val('po-status')});save();closeModal();render()}}])}
function importPontaj(){const f=document.getElementById('file');f.onchange=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=ev=>{parseLines(ev.target.result).forEach(x=>S.pontaj.push({id:id(),angajat:x.den,data:today(),zile:n(x.cant)||1,locatie:'',status:'importat'}));save();render();toast('Pontaj importat')};rd.readAsText(file)};f.value='';f.click()}
function rSalarii(){const emp={};S.pontaj.forEach(p=>{const d=new Date(p.data),day=d.getDate(),per=day<=15?'1-15':'16-31',key=p.angajat+'|'+per;emp[key]=emp[key]||{angajat:p.angajat,per,zile:0,salariuZi:0};emp[key].zile+=n(p.zile)});return `<div class="row"><h2 class="title">Salarii</h2><span class="spacer"></span><button class="btn" onclick="calcSalary()">Calculează din pontaj</button></div><div class="tablewrap"><table><thead><tr><th>Angajat</th><th>Perioadă</th><th class="num">Zile lucrate</th><th class="num">Salariu/zi</th><th class="num">Total</th></tr></thead><tbody>${Object.values(emp).map((x,i)=>`<tr><td>${esc(x.angajat)}</td><td>${x.per}</td><td class="num">${fmt(x.zile)}</td><td class="num"><input type="number" step="any" value="${S.salarii.find(s=>s.angajat===x.angajat)?.salariuZi||0}" onchange="setSal('${esc(x.angajat)}',this.value)"></td><td class="num"><b>${ron(x.zile*n(S.salarii.find(s=>s.angajat===x.angajat)?.salariuZi))}</b></td></tr>`).join('')}</tbody></table></div>`}
function setSal(ang,v){let s=S.salarii.find(x=>x.angajat===ang);if(!s){s={angajat:ang,salariuZi:0};S.salarii.push(s)}s.salariuZi=n(v);save();render()}function calcSalary(){render();toast('Calcul actualizat')}
function rSetari(){const s=S.settings;return `<h2 class="title">Setări firmă și ofertă</h2><div class="card"><div class="grid g2"><div class="field"><label>Denumire firmă</label><input id="se-co" value="${esc(s.co)}"></div><div class="field"><label>Slogan</label><input id="se-slogan" value="${esc(s.slogan)}"></div><div class="field"><label>CIF</label><input id="se-cif" value="${esc(s.cif)}"></div><div class="field"><label>Reg. Com.</label><input id="se-reg" value="${esc(s.reg)}"></div><div class="field"><label>Telefon</label><input id="se-tel" value="${esc(s.tel)}"></div><div class="field"><label>Email</label><input id="se-email" value="${esc(s.email)}"></div><div class="field"><label>IBAN</label><input id="se-iban" value="${esc(s.iban)}"></div><div class="field"><label>Bancă</label><input id="se-banca" value="${esc(s.banca)}"></div><div class="field"><label>TVA %</label><input id="se-tva" type="number" value="${esc(s.tva)}"></div><div class="field"><label>Avans implicit %</label><input id="se-avans" type="number" value="${esc(s.avans)}"></div><div class="field"><label>Garanție luni</label><input id="se-garantieLuni" type="number" value="${esc(s.garantieLuni)}"></div><div class="field"><label>Valabilitate zile</label><input id="se-valabilitateZile" type="number" value="${esc(s.valabilitateZile)}"></div></div><div class="field"><label>Adresă firmă</label><input id="se-adresa" value="${esc(s.adresa)}"></div><div class="field"><label>Obiect ofertă implicit</label><textarea id="se-obiect">${esc(s.obiect)}</textarea></div><div class="field"><label>Oferta nu include, câte una pe rând</label><textarea id="se-excluderi">${esc(s.excluderi.join('\n'))}</textarea></div><button class="btn" onclick="saveSettings()">Salvează setări</button> <button class="btn sec" onclick="restoreBackup()">Import backup</button> <button class="btn danger" onclick="resetAll()">Reset local</button></div>`}
function saveSettings(){const s=S.settings;['co','slogan','cif','reg','tel','email','iban','banca','adresa','obiect'].forEach(k=>s[k]=val('se-'+k));['tva','avans','garantieLuni','valabilitateZile'].forEach(k=>s[k]=n(val('se-'+k)));s.excluderi=val('se-excluderi').split('\n').map(x=>x.trim()).filter(Boolean);save();toast('Setări salvate')}
function printOffer(oid){const o=S.oferte.find(x=>x.id===oid);const t=offerTotal(o),s=S.settings;const groups={};(o.rows||[]).filter(r=>r.inclus!==false).forEach(r=>(groups[r.domeniu||'Diverse']=groups[r.domeniu||'Diverse']||[]).push(r));let nr=10;document.getElementById('print').innerHTML=`<div class="doc"><div class="doc-head"><div><div class="co">${esc(s.co)}</div><div>${esc(s.slogan)}</div></div><div class="right"><b>${esc(s.co)}</b><br>CIF: ${esc(s.cif)}<br>${esc(s.adresa)}<br>Tel: ${esc(s.tel)} | ${esc(s.email)}<br>IBAN: ${esc(s.iban)} — ${esc(s.banca)}</div></div><div class="band">OFERTĂ DE PREȚURI <span style="float:right">Nr. ${esc(o.nr)} | Data: ${rodate(o.data)} | Valabilă: ${rodate(o.valabilitate)}</span></div><table class="kv"><tr><td class="k">Solicitant / Firmă</td><td>${esc(o.beneficiar)}</td></tr><tr><td class="k">Adresă / Șantier</td><td>${esc(o.santier||o.adresa||'')}</td></tr><tr><td class="k">CIF / CNP</td><td>${esc(o.cui||'')}</td></tr><tr><td class="k">Tel / Email</td><td>${esc(o.contact||'')}</td></tr></table><div class="band">OBIECTUL OFERTEI</div><div style="border:1px solid #cfd8e4;border-top:0;padding:6px;font-style:italic">${esc(o.obiect)}</div><table class="items"><thead><tr><th>Nr.</th><th>Denumire lucrare / serviciu</th><th>U.M.</th><th>Cant.</th><th>Preț unitar<br>fără TVA</th><th>Valoare<br>fără TVA</th><th>TVA ${o.tva}%</th></tr></thead><tbody>${Object.entries(groups).map(([g,rows])=>{const sub=rows.reduce((a,r)=>a+n(r.cant)*n(r.pret),0);return `<tr><td colspan="7"><b>${esc(g)}</b></td></tr>`+rows.map(r=>`<tr><td class="num">${nr+=10}</td><td>${esc(r.produs||r.den)}<div class="mini">${esc(r.den!==r.produs?r.den:'')}</div></td><td>${esc(r.um)}</td><td class="num">${fmt(r.cant)}</td><td class="num">${fmt(r.pret)}</td><td class="num"><b>${fmt(n(r.cant)*n(r.pret))}</b></td><td class="num">${fmt(n(r.cant)*n(r.pret)*o.tva/100)}</td></tr>`).join('')+`<tr><td colspan="5" class="num"><b>Subtotal ${esc(g)}</b></td><td class="num"><b>${fmt(sub)}</b></td><td class="num">${fmt(sub*o.tva/100)}</td></tr>`}).join('')}</tbody></table><div class="totalband"><span>TOTAL CU TVA</span><span>${ron(t.sub)} &nbsp;&nbsp; ${ron(t.total)}</span></div><div class="twocol" style="margin-top:8px"><div><div class="boxh">CONDIȚII DE PLATĂ</div><table class="kv"><tr><td>Avans ${o.avans}%</td><td class="num">${ron(t.total*n(o.avans)/100)}</td></tr><tr><td>Rest ${100-n(o.avans)}%</td><td class="num">${ron(t.total*(100-n(o.avans))/100)}</td></tr><tr><td>Modalitate</td><td>${esc(s.modalitate)}</td></tr><tr><td>Penalități</td><td>${esc(s.penalitati)}</td></tr></table></div><div><div class="boxh">GARANȚII ȘI TERMENE</div><table class="kv"><tr><td>Garanție lucrări executate</td><td>${esc(s.garantieLuni)} luni</td></tr><tr><td>Valabilitate ofertă</td><td>${esc(s.valabilitateZile)} zile</td></tr><tr><td>Regim TVA</td><td>TVA ${esc(s.tva)}% — la încasare</td></tr></table></div></div><div class="boxh" style="margin-top:8px">NORMATIVE TEHNICE APLICATE</div><div style="border:1px solid #cfd8e4;padding:6px">I9, I13, GP 043, NP 059, SR 1343, SR 1797, STAS 816/80, SR 1846/2-2007 — după caz.</div><div style="border:1px solid #e7bf58;background:#fff8df;padding:6px;margin-top:8px"><b>OFERTA NU INCLUDE:</b><br>${s.excluderi.map(x=>'• '+esc(x)).join('<br>')}</div><div class="sign"><div>FURNIZOR<br>${esc(s.co)}</div><div>BENEFICIAR<br>${esc(o.beneficiar)}</div></div></div>`;setTimeout(()=>window.print(),100)}
function exportOfferCSV(oid){const o=S.oferte.find(x=>x.id===oid);download('oferta-'+o.nr.replace('/','-')+'.csv','Domeniu,Denumire beneficiar,Produs intern,UM,Cantitate,Pret fara TVA,Total fara TVA,TVA,Total cu TVA,Status\n'+o.rows.map(r=>[r.domeniu,r.den,r.produs,r.um,r.cant,r.pret,n(r.cant)*n(r.pret),n(r.cant)*n(r.pret)*o.tva/100,n(r.cant)*n(r.pret)*(1+o.tva/100),r.status].map(csv).join(',')).join('\n'))}
function exportCatalog(){download('catalog-manopera.csv','Domeniu,Categorie,Denumire,UM,Pret fara TVA,TVA,Pret cu TVA,Tip,Normativ,Descriere\n'+S.catalog.map(a=>[a.domeniu,a.cat,a.den,a.um,a.pret,a.tva,n(a.pret)*(1+n(a.tva)/100),a.tip,a.norm,a.desc].map(csv).join(',')).join('\n'))}
function csv(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}function download(name,content){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}function backup(){download('backup-scv-aqua-manager.json',JSON.stringify(S,null,2))}function restoreBackup(){const f=document.getElementById('file');f.onchange=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=ev=>{try{S=Object.assign(structuredClone(DEFAULT),JSON.parse(ev.target.result));save();render();toast('Backup importat')}catch(err){alert('Backup invalid')}};rd.readAsText(file)};f.value='';f.click()}function resetAll(){if(confirm('Ștergi toate datele locale?')){localStorage.removeItem(LSKEY);S=load();render()}}
function val(id){return document.getElementById(id)?.value||''}function openModal(title,body,actions=[],wide){document.getElementById('mtitle').textContent=title;document.getElementById('mbody').innerHTML=body;document.getElementById('mfoot').innerHTML=actions.map((a,i)=>`<button class="btn ${a.cls||''}" id="act${i}">${esc(a.label)}</button>`).join('');actions.forEach((a,i)=>document.getElementById('act'+i).onclick=a.fn);document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
render();
</script>
</body>
</html>
