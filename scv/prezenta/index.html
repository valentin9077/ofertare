<!DOCTYPE html>
<html lang="ro">
<head>

<meta name="theme-color" content="#F2F4F7">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">

<style>
/* Prezență – ce are în plus față de lib/ui.css (acolo stau culorile, literele, butoanele, cardurile, bara de jos). */
.dh{display:flex;align-items:center;gap:10px;margin:6px 2px 14px}
/* cardul închis de sus: data, șantierul zilei, câți sunt prezenți */
.hrow{display:flex;align-items:center;gap:6px}
.hrow .hib{width:30px;height:30px}
.hdate{position:relative;font-size:15px;font-weight:600;color:#fff;padding:0 2px;white-space:nowrap}
.hdate input{position:absolute;left:-4px;top:-8px;width:calc(100% + 8px);height:calc(100% + 16px);min-height:0;padding:0;border:0;opacity:0}
.hft{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap}
.hft .lg{flex:1;min-width:150px}
.hpill{position:relative}
.hpill span{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hpill select{position:absolute;left:0;top:0;width:100%;height:100%;min-height:0;padding:0;border:0;opacity:0}
.hero .hx{margin-top:12px;font-size:13px;color:#C9D8EA}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.hgrid small{display:block;font-size:12px;font-weight:500;color:var(--onnavy2);line-height:1.25}
.hgrid b{display:block;font-size:16px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.qa button{width:84px;white-space:nowrap}
/* rândul unui om, în Azi */
.rb{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;min-height:46px}
/* fișa de marcare */
.shh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.shh .who{flex:1;min-width:0}.shh .who b{display:block;font-size:18px;font-weight:700}.shh .who small{color:var(--mut);font-size:13px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.opt{display:flex;align-items:center;gap:9px;min-height:54px;padding:0 14px;border-radius:16px;background:var(--bg);font-weight:600;font-size:15px;text-align:left;color:var(--ink2);line-height:1.2}
.opt:nth-child(1),.opt:nth-child(2){min-height:64px;font-size:16.5px;font-weight:700}
.opt:last-child:nth-child(odd){grid-column:1/-1}
.opt.on{box-shadow:inset 0 0 0 2px currentColor}
.opt.dash{box-shadow:inset 0 0 0 2px var(--line)}
.ck{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:500;color:var(--ink2)}
.sfl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.sfl input[type=number]{width:110px}.sfl input[type=text]{flex:1;min-width:120px}
/* salarii */
.roster{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--sh1);margin-bottom:14px;overflow:hidden}
.pr{padding:14px 16px;border-bottom:1px solid var(--line2)}
.pr:last-child{border-bottom:0}
.r1{display:flex;align-items:center;gap:10px}
.r1 .who{flex:1;min-width:0}
.r1 .who b{font-size:16.5px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r1 .who small{color:var(--mut);font-size:13px}
.amt{text-align:right;flex:none}
.amt b{font-size:22px;font-weight:800;display:block;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.amt small{color:var(--mut);font-size:12px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;font-size:12px;font-weight:500;color:var(--mut)}
.kv b{display:block;font-size:14.5px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.kv i{font-style:normal}
@media(min-width:700px){.kv{grid-template-columns:repeat(6,1fr)}}
.r2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:15px}
.r2 label.ck{color:var(--mut)}
/* tabele */
td.n,th.n{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:600;z-index:2;box-shadow:inset -1px 0 0 var(--line2)}
td.num{text-align:right}
tr.tot td{font-weight:700;background:var(--bg)}
.cell{min-width:32px;height:32px;border-radius:9px;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center}
.cell.e{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2);color:transparent}
.cell.W{background:var(--bg);box-shadow:none}
.cell.H{background:var(--warn-bg);color:var(--warn)}
.cell.l{box-shadow:inset 0 0 0 1.5px currentColor}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;margin:0 2px 12px;color:var(--mut)}
.legend b{color:var(--ink);font-weight:700;margin-right:4px}
.legend i{display:none}
.mono{font-variant-numeric:tabular-nums}
.list .it{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.list .it:last-child{border-bottom:none}
/* setări */
.emp{border-radius:18px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
.emp.open{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--navy2)}
.emph{display:flex;align-items:center;gap:10px;width:100%;text-align:left;flex-wrap:wrap;min-height:34px}
.emph b{font-size:16.5px;font-weight:700}
.emph .chev{color:var(--mut);font-size:13px;margin-left:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.pr .grid2{grid-template-columns:1fr}
@media(min-width:700px){.pr .grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top"><div class="tt"><small id="hsm">Prezență SCV</small><b id="hbg"></b></div><span id="save" class="st"></span></header>
<main id="main"><div class="empty">Se încarcă…</div></main>
<nav id="nav" class="fnav">
<button data-t="azi" class="on"><i data-ic="clock" data-s="21"></i><span>Azi</span></button>
<button data-t="luna"><i data-ic="calendar-days" data-s="21"></i><span>Luna</span></button>
<button data-t="sal"><i data-ic="banknote" data-s="21"></i><span>Salarii</span></button>
<button data-t="conc"><i data-ic="tree-palm" data-s="21"></i><span>Concedii</span></button>
<button data-t="sit"><i data-ic="building-2" data-s="21"></i><span>Șantiere</span></button>
<button data-t="set"><i data-ic="settings" data-s="21"></i><span>Setări</span></button>
</nav>
<div class="toast" id="toast"></div>

<script src="../lib/vendor/supabase.js"></script>
<script src="../lib/icons.js?v=1"></script>
<script src="../lib/scv.js?v=6"></script>
<script>
"use strict";
SCVI.fill(document);
/* ============ utilitare ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const DS=(y,m,d)=>y+"-"+pad(m)+"-"+pad(d);
const dim=(y,m)=>new Date(y,m,0).getDate();
const dowOf=(y,m,d)=>new Date(y,m-1,d).getDay();
const DN=["dum","lun","mar","mie","joi","vin","sâm"], DNL=["duminică","luni","marți","miercuri","joi","vineri","sâmbătă"];
const MN=["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"];
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isNaN(n)?0:n};
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const money=x=>(x||0).toLocaleString("ro-RO",{minimumFractionDigits:2,maximumFractionDigits:2});
const todayStr=()=>{const t=new Date();return DS(t.getFullYear(),t.getMonth()+1,t.getDate())};
const parseDS=s=>{const p=s.split("-").map(Number);return{y:p[0],m:p[1],d:p[2]}};
const addDays=(s,n)=>{const p=parseDS(s);const t=new Date(p.y,p.m-1,p.d+n);return DS(t.getFullYear(),t.getMonth()+1,t.getDate())};
const roDate=s=>{const p=parseDS(s);return pad(p.d)+"."+pad(p.m)+"."+p.y};
let toastT;const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),2200)};

/* ============ constante ============ */
const ST={P:{n:"Prezent",s:"Prez.",c:"var(--P)"},A:{n:"Absent",s:"Abs.",c:"var(--A)"},CO:{n:"Concediu de odihnă",s:"C.odih.",c:"var(--CO)"},CM:{n:"Concediu medical",s:"C.med.",c:"var(--CM)"},CFP:{n:"Concediu fără salariu",s:"Fără sal.",c:"var(--CFP)"}};
const CODES=["P","A","CO","CM","CFP"];
const DEF_HOL={2026:[["2026-01-01","Anul Nou"],["2026-01-02","Anul Nou (a doua zi)"],["2026-01-06","Boboteaza"],["2026-01-07","Sf. Ioan Botezătorul"],["2026-01-24","Ziua Unirii"],["2026-04-10","Vinerea Mare"],["2026-04-12","Paștele"],["2026-04-13","Paștele (a doua zi)"],["2026-05-01","Ziua Muncii"],["2026-05-31","Rusaliile"],["2026-06-01","Rusalii / Ziua Copilului"],["2026-08-15","Adormirea Maicii Domnului"],["2026-11-30","Sf. Andrei"],["2026-12-01","Ziua Națională"],["2026-12-25","Crăciunul"],["2026-12-26","Crăciunul (a doua zi)"]].map(x=>({d:x[0],n:x[1]}))};

/* ============ stare ============ */
let store=null, ME=null, S={emps:[],holidays:{},mult:0,diurna:0,sites:[],lastSite:""}, L=[], months={};
let openSite=null, daySite="";
let tab="azi", curDay=todayStr(), curYM=todayStr().slice(0,7), tr="1", openEmp=null, ready=false, confirmDel=null;
const openSet=new Set();   /* fișele de angajați deschise în Setări */

/* ============ salvare ============ */
function setSaveLbl(t,warn){const e=$("#save");e.textContent=t;e.classList.toggle("bad",!!warn)}
function persist(path,getter){if(store)store.put(path,getter)}
const saveSettings=()=>persist("app/settings",()=>S);
const saveLeaves=()=>persist("app/concedii",()=>({list:L}));
function monthDoc(ym){const m=months[ym]||(months[ym]={});m.marks=m.marks||{};m.dep=m.dep||{};m.adv=m.adv||{};m.paid=m.paid||{};m.site=m.site||{};m.sup=m.sup||{};return m}
const saveMonth=ym=>persist("luni/"+ym,()=>months[ym]);

const fn=e=>(e&&(e.full||e.nume))||"?";
function normS(){if(S.zl==null)S.zl=21;S.sites=S.sites||[];S.holidays=S.holidays||{};S.sites.forEach(s=>{});S.emps.forEach(e=>{if(e.activ===false&&!e.end){e.end=addDays(todayStr(),-1)}delete e.activ;if(e.full==null)e.full="";if(!e.rates||!e.rates.length)e.rates=[{from:"2000-01-01",sal:num(e.sal),cost:num(e.cost)}];
  e.rates.forEach(x=>{if(x.from.length===7)x.from+="-01"});e.rates.sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:0);e.rates[0].from="2000-01-01"})}
function rate(e,date){const rs=e.rates||[];if(!rs.length)return{sal:num(e.sal),cost:0};let r=rs[0];rs.forEach(x=>{if(x.from<=date)r=x});return{sal:num(r.sal),cost:num(r.cost)}}
const activeSites=()=>(S.sites||[]).filter(x=>x.st!=="fin"&&!x.arh);
function defSite(){const a=activeSites();if(daySite&&a.some(x=>x.id===daySite))return daySite;if(S.lastSite&&a.some(x=>x.id===S.lastSite))return S.lastSite;return a.length===1?a[0].id:""}
function siteOf(emp,date){const m=months[date.slice(0,7)];return(m&&m.site&&m.site[emp]&&m.site[emp][+date.slice(8)])||""}
function siteName(id){const s=(S.sites||[]).find(x=>x.id===id);return s?s.nume:(id?"(șantier șters)":"fără șantier")}
function siteOpts(sel){const a=activeSites();let o=`<option value="">— fără șantier —</option>`;const seen={};a.forEach(s=>{seen[s.id]=1;o+=`<option value="${s.id}" ${s.id===sel?"selected":""}>${esc(s.nume)}</option>`});
  if(sel&&!seen[sel]){const s=(S.sites||[]).find(x=>x.id===sel);o+=`<option value="${sel}" selected>${esc(s?s.nume+" (finalizat)":"(șantier șters)")}</option>`}return o}
function hasAny(id){return Object.keys(months).some(ym=>hasData(id,ym))||L.some(l=>l.emp===id)}
function siteReport(id){const R={byEmp:{},byMonth:{},days:0,c1:0,c2:0,first:"",last:"",list:[]};
  Object.keys(months).sort().forEach(ym=>{const m=months[ym];if(!m||!m.site)return;const wm=divisor(ym);if(!wm)return;
    Object.keys(m.site).forEach(emp=>{const e=S.emps.find(x=>x.id===emp);
      Object.keys(m.site[emp]).forEach(d=>{if(m.site[emp][d]!==id)return;if(!(m.marks&&m.marks[emp]&&m.marks[emp][d]==="P"))return;
        const ds=ym+"-"+pad(+d),f=dayType(ds).work?1:num(S.mult),rt=e?rate(e,ds):{sal:0,cost:0},a=rt.sal/wm*f,b=rt.cost/wm*f;
        const E=R.byEmp[emp]||(R.byEmp[emp]={name:e?e.nume:"(angajat șters)",days:0,c1:0,c2:0});E.days++;E.c1+=a;E.c2+=b;
        const M=R.byMonth[ym]||(R.byMonth[ym]={days:0,c1:0,c2:0});M.days++;M.c1+=a;M.c2+=b;
        R.days++;R.c1+=a;R.c2+=b;if(!R.first||ds<R.first)R.first=ds;if(!R.last||ds>R.last)R.last=ds;R.list.push({d:ds,name:E.name})})})});
  R.c1=r2(R.c1);R.c2=r2(R.c2);return R}
function unassigned(){let c=0;Object.keys(months).forEach(ym=>{const m=months[ym];if(!m||!m.marks)return;Object.keys(m.marks).forEach(emp=>Object.keys(m.marks[emp]).forEach(d=>{if(m.marks[emp][d]==="P"&&!(m.site&&m.site[emp]&&m.site[emp][d]))c++}))});return c}

/* ============ calendar / reguli ============ */
function holList(y){return (S.holidays&&S.holidays[y])||DEF_HOL[y]||[]}
function holMap(y){const o={};holList(y).forEach(h=>o[h.d]=h.n);return o}
function dayType(s){const p=parseDS(s);const w=dowOf(p.y,p.m,p.d);const H=holMap(p.y);if(H[s])return{t:"H",n:H[s],work:false};if(w===0||w===6)return{t:"W",n:DNL[w],work:false};return{t:"",n:"",work:true}}
function workDaysInMonth(ym){const p=ym.split("-").map(Number);let c=0;for(let d=1;d<=dim(p[0],p[1]);d++)if(dayType(DS(p[0],p[1],d)).work)c++;return c}
function leaveFor(emp,d){for(const l of L)if(l.emp===emp&&l.from<=d&&d<=l.to)return l;return null}
function eff(emp,d){const m=months[d.slice(0,7)];const v=m&&m.marks&&m.marks[emp]&&m.marks[emp][+d.slice(8)];
  if(v)return{s:v,src:"m"};const l=leaveFor(emp,d);if(l&&dayType(d).work)return{s:l.tip,src:"l"};return{s:"",src:""}}
function worksOn(e,d){return(!e.start||e.start<=d)&&(!e.end||d<=e.end)}
function isFormer(e){return !!e.end&&e.end<todayStr()}
function activeEmps(ym){const p=ym.split("-").map(Number),a=ym+"-01",b=DS(p[0],p[1],dim(p[0],p[1]));return S.emps.filter(e=>((!e.start||e.start<=b)&&(!e.end||e.end>=a))||hasData(e.id,ym))}
const okWord=id=>{const el=document.getElementById(id);return el&&/^[sș]terge$/i.test(el.value.trim())};
function hasData(id,ym){const m=months[ym];if(!m)return false;return !!((m.marks&&m.marks[id]&&Object.values(m.marks[id]).some(Boolean))||(m.dep&&(m.dep[id]||[]).length)||(m.sup&&(m.sup[id]||[]).length)||(m.adv&&(m.adv[id]||[]).length))}

/* Cu câte zile se împarte salariul lunar ca să afli valoarea unei zile (la tine: 21). 0 = zilele lucrătoare reale ale lunii. */
function divisor(ym){return num(S.zl)>0?num(S.zl):workDaysInMonth(ym)}
/* Plata pe o perioadă formată din tranșe întregi (1–15, 16–sfârșit):
   fiecare tranșă = jumătate din salariul lunar, minus zilele absente / fără salariu / medicale (fiecare la salariu ÷ zile-pe-lună).
   Cine a fost angajat doar o parte din tranșă primește zilele lucrate × valoarea zilei (cel mult jumătatea). */
function calc(emp,ym,d1,d2){
  const p=ym.split("-").map(Number),y=p[0],m=p[1],N=dim(y,m),wm=divisor(ym);
  let wp=0,un=0,cm=0,co=0,pr=0,nm=0,ex=0,out=0,base=0,b2=0,extra=0;
  [[1,15],[16,N]].forEach(([ta,tb])=>{if(ta<d1||tb>d2)return;
    let wT=0,wE=0,half=0,half2=0,sumE=0,sumE2=0,ded=0,ded2=0;
    for(let d=ta;d<=tb;d++){const s=DS(y,m,d),dt=dayType(s),st=eff(emp.id,s).s,r=rate(emp,s),v=wm?r.sal/wm:0,v2=wm?r.cost/wm:0,on=worksOn(emp,s);
      if(!dt.work){if(on&&st==="P"){ex++;extra+=v*num(S.mult);b2+=v2*num(S.mult)}continue}
      wT++;wp++;half+=r.sal/2;half2+=r.cost/2;
      if(!on){out++;continue}
      wE++;sumE+=v;sumE2+=v2;
      if(st==="A"||st==="CFP"){un++;ded+=v;ded2+=v2}else if(st==="CM"){cm++;ded+=v;ded2+=v2}else if(st==="CO")co++;else if(st==="P")pr++;else nm++}
    if(!wT||!wE)return;
    half/=wT;half2/=wT;
    const g=wE===wT?half:Math.min(half,sumE),g2=wE===wT?half2:Math.min(half2,sumE2);
    base+=Math.max(0,g-ded);b2+=Math.max(0,g2-ded2)});
  const md=months[ym]||{};
  const inR=a=>(a||[]).filter(x=>x.d>=d1&&x.d<=d2).reduce((a,x)=>a+num(x.sum),0);
  const dep=inR((md.dep||{})[emp.id]),adv=inR((md.adv||{})[emp.id]),sup=inR((md.sup||{})[emp.id]);
  base=r2(base);extra=r2(extra);const val=wm?r2(rate(emp,DS(y,m,d2)).sal/wm):0;
  return{val,wm,wp,un,cm,co,pr,nm,ex,out,base,extra,cuv:r2(base+extra),cuv2:r2(b2),dep:r2(dep),adv:r2(adv),sup:r2(sup),pay:r2(base+extra+sup+dep-adv)}
}
function monthStats(emp,ym){const p=ym.split("-").map(Number);const o={P:0,A:0,CO:0,CM:0,CFP:0,ex:0,nm:0,work:0};
  for(let d=1;d<=dim(p[0],p[1]);d++){const s=DS(p[0],p[1],d),dt=dayType(s),st=eff(emp.id,s).s;
    if(!worksOn(emp,s))continue;if(dt.work){o.work++;if(st)o[st]++;else o.nm++}else if(st==="P")o.ex++}
  return o}
function workdaysBetween(a,b){let c=0;for(let d=a;d<=b;d=addDays(d,1))if(dayType(d).work)c++;return c}

/* ============ acțiuni ============ */
function markQuiet(emp,date,val){const ym=date.slice(0,7),m=monthDoc(ym),d=+date.slice(8);m.marks[emp]=m.marks[emp]||{};m.site[emp]=m.site[emp]||{};
  if(val){m.marks[emp][d]=val;if(val==="P"){if(!m.site[emp][d]){const s=defSite();if(s)m.site[emp][d]=s}}else delete m.site[emp][d]}
  else{delete m.marks[emp][d];delete m.site[emp][d]}}
function setMark(emp,date,val){markQuiet(emp,date,val);saveMonth(date.slice(0,7));render()}
function setSite(emp,date,id){const ym=date.slice(0,7),m=monthDoc(ym),d=+date.slice(8);m.site[emp]=m.site[emp]||{};if(id)m.site[emp][d]=id;else delete m.site[emp][d];saveMonth(ym);render()}
function toggleMark(emp,date,code){const cur=eff(emp,date);setMark(emp,date,cur.src==="m"&&cur.s===code?"":code)}
function setDep(emp,date,on,sum,loc){const ym=date.slice(0,7),m=monthDoc(ym),d=+date.slice(8);
  let a=(m.dep[emp]||[]).filter(x=>x.d!==d);if(on)a.push({d,sum:r2(num(sum)),loc:loc||""});a.sort((x,y)=>x.d-y.d);m.dep[emp]=a;saveMonth(ym);render()}
function getDep(emp,date){const m=months[date.slice(0,7)];return m&&m.dep&&(m.dep[emp]||[]).find(x=>x.d===+date.slice(8))}

/* ============ ecrane ============ */
let inClick=false;
/* Nu redesenăm peste un câmp în care se scrie, decât la o apăsare de buton (atunci închidem întâi câmpul, ca să i se salveze valoarea). */
function render(force){if(!ready)return;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  const f=document.activeElement;if(f&&/INPUT|TEXTAREA|SELECT/.test(f.tagName)&&f.dataset.keep){if(!(force||inClick))return;f.blur()}
  if(tab!=="azi")sheetEmp=null;hdr();
  const fn={azi:vAzi,luna:vLuna,sal:vSal,conc:vConc,sit:vSit,set:vSet}[tab];$("#main").innerHTML=fn()}

/* ---------- piese de desen ---------- */
let sheetEmp=null;   /* omul a cărui fișă de marcare e deschisă (în Azi) */
const IC=(n,z,w)=>window.SCVI?SCVI.icon(n,z,w):"";
const STI={P:"check",A:"x",CO:"tree-palm",CM:"stethoscope",CFP:"ban"};
const STS={P:"Prezent",A:"Absent",CO:"Concediu",CM:"Medical",CFP:"Fără salariu"};
const avK=id=>"k"+(Math.max(0,S.emps.findIndex(e=>e.id===id))%8);
const ini=n=>esc(String(n||"?").trim().slice(0,2).toUpperCase());
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
function greet(){const h=new Date().getHours();return h<11?"Bună dimineața":h<18?"Bună ziua":"Bună seara"}
const TABN={luna:"Luna",sal:"Salarii",conc:"Concedii",sit:"Șantiere",set:"Setări"};
/* antetul: în Azi salută; în rest spune pe ce ecran ești */
function hdr(){const a=$("#hsm"),b=$("#hbg");if(!a||!b)return;
  if(tab==="azi"){a.textContent=S.owner?greet()+",":greet();b.textContent=S.owner||"Prezență SCV"}
  else{a.textContent="Prezență SCV";b.textContent=TABN[tab]||""}}

function vAzi(){
  const dt=dayType(curDay),p=parseDS(curDay),w=dowOf(p.y,p.m,p.d);
  const emps=S.emps.filter(e=>worksOn(e,curDay));
  if(!emps.length)return `<div class="card empty">Nu ai angajați. Adaugă-i în Setări.</div>`;
  const cnt={P:0,A:0,CO:0,CM:0,CFP:0,n:0};const sts=emps.map(e=>{const x=eff(e.id,curDay).s;if(x)cnt[x]++;else cnt.n++;return x});
  const conc=cnt.CO+cnt.CM+cnt.CFP,lg=[];
  if(cnt.A)lg.push(`<span><b style="background:var(--neg-dot)"></b>${cnt.A} ${cnt.A===1?"absent":"absenți"}</span>`);
  if(conc)lg.push(`<span><b style="background:var(--warn-dot)"></b>${conc} în concediu</span>`);
  if(cnt.n)lg.push(`<span><b style="background:#6E89B0"></b>${cnt.n} ${cnt.n===1?"nemarcat":"nemarcați"}</span>`);
  if(!lg.length)lg.push(`<span>Toți sunt marcați.</span>`);
  let h=`<section class="hero"><div class="hrow"><button class="hib" data-a="day" data-n="-1" aria-label="Ziua dinainte">${IC("chevron-left",18,2.4)}</button>
  <label class="hdate">${cap(DN[w])}, ${p.d} ${MN[p.m-1]}${p.y!==+todayStr().slice(0,4)?" "+p.y:""}<input type="date" id="dpick" value="${curDay}" data-keep="1" aria-label="Alege data"></label>
  <button class="hib" data-a="day" data-n="1" aria-label="Ziua următoare">${IC("chevron-right",18,2.4)}</button></div>
  <div class="hb">${cnt.P} din ${emps.length}<span>prezenți</span></div>
  <div class="segb">${sts.map(x=>`<i class="${x||""}"></i>`).join("")}</div>
  <div class="hft"><div class="lg">${lg.join("")}</div><label class="hpill">${IC("map-pin",14,2.2)}<span>${esc(siteName(defSite()))}</span>${IC("chevron-down",13,2.6)}<select id="daysite" aria-label="Șantierul zilei">${siteOpts(defSite())}</select></label></div>
  ${dt.work?"":`<div class="hx">${dt.t==="H"?"Sărbătoare legală: "+esc(dt.n):"Weekend"}. Nu e zi lucrătoare, dar poți marca cine a lucrat.</div>`}
  ${curDay===todayStr()?"":`<button class="hpill" data-a="today" style="margin-top:12px">Înapoi la azi</button>`}</section>
  <div class="qa"><button class="pr" data-a="allP"><span class="qi">${IC("check-check",24,2)}</span>Toți prezenți</button>
  <button data-a="tab" data-t="conc"><span class="qi">${IC("tree-palm",23,1.9)}</span>Concediu</button>
  <button data-a="tab" data-t="sal"><span class="qi">${IC("wallet",23,1.9)}</span>Avans</button>
  <button data-a="xacc"><span class="qi">${IC("file-down",23,1.9)}</span>Export</button></div>
  ${activeSites().length?"":'<div class="note">Nu ai niciun șantier în lucru. Adaugă unul în fila Șantiere.</div>'}
  <div class="sh"><b>Echipa</b><span>${emps.length} ${emps.length===1?"om":"oameni"}</span></div><div class="lst">`;
  emps.forEach(e=>{const ef=eff(e.id,curDay),dep=getDep(e.id,curDay),site=siteOf(e.id,curDay);
    const sub=ef.src==="l"?"din concedii":ef.s==="P"?(site?siteName(site):"fără șantier"):ef.s?ST[ef.s].n.toLowerCase():"nemarcat";
    h+=`<div class="r li"><button class="rb" data-a="who" data-e="${e.id}" aria-label="${esc(e.nume)}: marchează"><span class="av ${avK(e.id)}">${ini(e.nume)}</span><span class="who"><b>${esc(e.nume)}</b><small>${esc(sub)}${dep?", deplasare "+money(num(dep.sum))+" lei":""}</small></span></button>
    <button class="chip ${ef.s?"on c-"+ef.s:"none"}" data-a="who" data-e="${e.id}">${ef.s?IC(STI[ef.s],15,2.6)+STS[ef.s]:"Marchează"}</button></div>`});
  return h+`</div>`+sheetHtml()}

/* Fișa unui om pe ziua aleasă: starea, șantierul, deplasarea. Se închide singură după ce alegi starea. */
function sheetHtml(){const e=sheetEmp&&S.emps.find(x=>x.id===sheetEmp);if(!e)return "";
  const ef=eff(e.id,curDay),dep=getDep(e.id,curDay),site=siteOf(e.id,curDay),p=parseDS(curDay),w=dowOf(p.y,p.m,p.d);

  <div class="shh"><span class="av ${avK(e.id)}">${ini(e.nume)}</span><div class="who"><b>${esc(e.nume)}</b><small>${DNL[w]}, ${p.d} ${MN[p.m-1]}${ef.src==="l"?" – din concedii":""}</small></div><button class="ibn" data-a="sheetx" aria-label="Închide" style="background:var(--bg);box-shadow:none">${IC("x",18,2.4)}</button></div>
  <div class="opts">${CODES.map(c=>`<button class="opt${ef.s===c?" on c-"+c:""}${ef.s===c&&ef.src==="l"?" dash":""}" data-a="mark" data-e="${e.id}" data-c="${c}" aria-label="${ST[c].n}">${IC(STI[c],20,2.4)}<span>${ST[c].n}</span></button>`).join("")}</div>
  ${ef.s==="P"?`<label class="f">Șantier</label><select data-a="esite" data-e="${e.id}" aria-label="Șantier" style="width:100%">${siteOpts(site)}</select>`:""}
  <div class="sfl"><label class="ck"><input type="checkbox" data-a="depon" data-e="${e.id}" ${dep?"checked":""}> Deplasare</label>
  ${dep?`<input type="number" step="0.01" inputmode="decimal" value="${dep.sum}" data-a="depsum" data-e="${e.id}" data-keep="1" aria-label="Sumă deplasare"> lei <input type="text" placeholder="unde" value="${esc(dep.loc||"")}" data-a="deploc" data-e="${e.id}" data-keep="1">`:""}</div>
  <div class="row" style="margin-top:16px">${ef.s&&ef.src!=="l"?`<button class="btn g" data-a="unmark" data-e="${e.id}">Șterge marcajul</button>`:""}<span class="sp"></span><button class="btn" data-a="sheetx">Gata</button></div></div>`}

function vLuna(){
  const p=curYM.split("-").map(Number),N=dim(p[0],p[1]),emps=activeEmps(curYM);
  let h=ymBar()+`<div class="legend">${CODES.map(c=>`<span><b>${c==="CFP"?"FS":c}</b>${ST[c].n.toLowerCase()}</span>`).join("")}<span><b>S</b>sărbătoare</span></div>`;
  if(!emps.length)return h+`<div class="card empty">Niciun angajat.</div>`;
  h+=`<p class="mut">Atinge o zi ca să schimbi: gol → Prezent → Absent → C.odihnă → C.medical → Fără salariu → gol.</p><div class="tw"><table><thead><tr><th class="n">Angajat</th>`;
  for(let d=1;d<=N;d++)h+=`<th>${d}<br><span class="mut">${DN[dowOf(p[0],p[1],d)]}</span></th>`;
  h+=`<th>Prez.</th><th>Abs.</th><th>CO</th><th>CM</th><th>CFP</th><th>Nemarc.</th></tr></thead><tbody>`;
  emps.forEach(e=>{h+=`<tr><td class="n">${esc(e.nume)}</td>`;
    for(let d=1;d<=N;d++){const s=DS(p[0],p[1],d),dt=dayType(s),ef=eff(e.id,s);
      let cls="cell e",txt="";if(ef.s){cls="cell c-"+ef.s+(ef.src==="l"?" l":"");txt=ef.s==="CFP"?"FS":ef.s}else if(dt.t==="H"){cls="cell H";txt="S"}else if(dt.t==="W"){cls="cell W";txt=""}
      h+=`<td><button class="${cls}" data-a="cell" data-e="${e.id}" data-d="${s}">${txt}</button></td>`}
    const st=monthStats(e,curYM);
    h+=`<td>${st.P}</td><td>${st.A}</td><td>${st.CO}</td><td>${st.CM}</td><td>${st.CFP}</td><td class="${st.nm?"warn":""}">${st.nm}</td></tr>`});
  return h+`</tbody></table></div><p class="mut">Zile lucrătoare în lună: <b>${workDaysInMonth(curYM)}</b>. „Nemarc." = zile lucrătoare fără nicio marcare (se plătesc ca prezent, dar verifică-le).</p>`}

function ymBar(){const p=curYM.split("-").map(Number);
  return `<div class="dh"><h2>${cap(MN[p[1]-1])} ${p[0]}</h2><div class="sp"></div><button class="ibn" data-a="ym" data-n="-1" aria-label="Luna dinainte">${IC("chevron-left",18,2.4)}</button><button class="ibn" data-a="ym" data-n="1" aria-label="Luna următoare">${IC("chevron-right",18,2.4)}</button></div>`}

function vSal(){
  const p=curYM.split("-").map(Number),N=dim(p[0],p[1]),emps=activeEmps(curYM);
  const d1=tr==="2"?16:1,d2=tr==="1"?15:N;
  const lbl=tr==="1"?"Tranșa 1 (1–15)":tr==="2"?`Tranșa 2 (16–${N})`:"Toată luna";
  let h=ymBar()+`<div class="seg2">${[["1","1 – 15"],["2","16 – "+N],["m","Toată luna"]].map(x=>`<button class="${tr===x[0]?"on":""}" data-a="tr" data-v="${x[0]}">${x[1]}</button>`).join("")}</div>`;
  if(!emps.length)return h+`<div class="card empty">Niciun angajat.</div>`;
  const tot={cuv:0,cuv2:0,dep:0,adv:0,pay:0};
  {const T=emps.map(e=>calc(e,curYM,d1,d2)),sm=k=>money(r2(T.reduce((a,c)=>a+c[k],0)));
   h+=`<section class="hero"><div class="hl">De plătit, ${lbl.charAt(0).toLowerCase()+lbl.slice(1)}</div><div class="hb">${sm("pay")}<span>lei</span></div>
   <div class="hgrid"><div><small>Cost cu taxe</small><b>${T.some(c=>c.cuv2>0)?sm("cuv2"):"lipsește"}</b></div><div><small>Suplimentar și deplasări</small><b>+ ${money(r2(T.reduce((a,c)=>a+c.sup+c.dep,0)))}</b></div><div><small>Avansuri</small><b>− ${sm("adv")}</b></div></div></section>`}
  {const md=months[curYM]||{},all=[];["adv","sup"].forEach(k=>emps.forEach(e=>((md[k]||{})[e.id]||[]).forEach((x,i)=>all.push({k,e,x,i}))));all.sort((a,b)=>a.x.d-b.x.d);
   const defd=todayStr().slice(0,7)===curYM?todayStr():DS(p[0],p[1],1);
   h+=`<div class="card"><h3>Avansuri și suplimentar în ${MN[p[1]-1]}</h3><div class="row"><select id="av_e" data-keep="1" style="flex:1;min-width:120px" aria-label="Angajat">${emps.map(e=>`<option value="${e.id}">${esc(e.nume)}</option>`).join("")}</select><select id="av_k" data-keep="1" aria-label="Fel"><option value="adv">Avans (se scade)</option><option value="sup">Suplimentar (se adaugă)</option></select><input type="date" id="av_d" value="${defd}" data-keep="1" aria-label="Data"><input type="number" id="av_s" inputmode="decimal" step="0.01" placeholder="suma (lei)" data-keep="1" style="width:110px"><input type="text" id="av_n" placeholder="notă (ex. sâmbătă)" data-keep="1" style="width:150px"><button class="btn" data-a="addadv2">Adaugă</button></div>
   <div class="list" style="margin-top:8px">${all.map(o=>`<div class="it"><span class="mono">${pad(o.x.d)}.${pad(p[1])}</span><b>${esc(o.e.nume)}</b><span class="pill">${o.k==="adv"?"avans":"suplimentar"}</span><span class="mono">${o.k==="adv"?"−":"+"}${money(num(o.x.sum))} lei</span><span class="mut">${esc(o.x.note||"")}</span><span class="sp"></span>${confirmDel===o.k+":"+o.e.id+":"+o.i?`<button class="btn r s" data-a="delent" data-k="${o.k}" data-e="${o.e.id}" data-i="${o.i}">Sigur? Șterge</button>`:`<button class="btn g s" data-a="ask" data-k="${o.k}:${o.e.id}:${o.i}">Șterge</button>`}</div>`).join("")||'<div class="mut">Nimic trecut în această lună. Avansul se scade din tranșa în care a fost dat. Suplimentarul (sâmbete, ore în plus) se adaugă la tranșa în care e trecut.</div>'}</div></div>`}
  h+=`<div class="roster">`;
  emps.forEach(e=>{const rt=rate(e,DS(p[0],p[1],d2)),c=calc(e,curYM,d1,d2),chg=rate(e,DS(p[0],p[1],d1)).sal!==rt.sal,md=months[curYM]||{},paid=((md.paid||{})[e.id]||{})["t"+tr];
    h+=`<div class="r pr"><div class="r1"><div class="who"><b>${esc(e.nume)}</b><small>${rt.sal?"salariu "+money(rt.sal)+" lei":'<span class="warn">salariu lipsă</span>'}${chg?" (schimbat în perioadă)":""}${c.nm?`, <span class="warn">${c.nm===1?"o zi nemarcată":c.nm+" zile nemarcate"}</span>`:""}</small></div>
    <div class="amt${c.pay<0?" neg":""}"><b>${money(c.pay)}</b><small>de plătit</small></div></div>
    <div class="kv"><span>Cuvenit<b>${money(c.cuv)}</b></span><span>Cu taxe<b>${rt.cost?money(c.cuv2):'<i class="warn">lipsă</i>'}</b></span><span>Suplimentar<b>${money(c.sup)}</b></span><span>Deplasări<b>${money(c.dep)}</b></span><span>Avans<b>${c.adv?"−"+money(c.adv):"0,00"}</b></span><span>Zile scăzute<b>${c.un+c.cm}${c.cm?" ("+c.cm+" med.)":""}${c.out?", "+c.out+" neangajat":""}</b></span></div>
    <div class="r2">${tr!=="m"?`<label class="ck"><input type="checkbox" data-a="paid" data-e="${e.id}" ${paid?"checked":""}> Plătit</label>`:""}<span class="sp"></span><button class="btn g s" data-a="open" data-e="${e.id}">${openEmp===e.id?"Ascunde":"Avansuri și deplasări"}</button></div>
    ${openEmp===e.id?`<div style="margin-top:10px">${empPanel(e)}</div>`:""}</div>`});
  h+=`</div>`;
  h+=`<div class="card" style="margin-top:12px"><h3>Cum se calculează</h3><div class="mut">Ca în tabelele tale: <b>fiecare tranșă = jumătate din salariul lunar</b>. Pentru fiecare zi marcată absent, fără salariu sau medical se scade o zi, adică salariul ÷ ${divisor(curYM)} (concediul medical îl calculează contabilul). Concediul de odihnă și sărbătorile legale sunt plătite. Cine a fost angajat doar o parte din tranșă primește zilele lucrate × valoarea zilei. <b>De plătit</b> = cuvenit + suplimentar + deplasări − avansuri din tranșă. „Cu taxe” e același calcul făcut cu „Om + taxe”. Sumele sunt estimări pentru tine; statul de plată oficial îl face contabilul.</div></div>`;
  h+=`<div class="card"><h3>Export</h3><div class="row"><button class="btn" data-a="xacc">Pontaj + concedii pentru contabil</button><button class="btn g" data-a="xpay">Fișa mea de plăți</button></div><div class="mut" style="margin-top:6px">Se creează un fișier Excel pe care îl trimiți tu mai departe. Aplicația nu trimite nimic singură.</div></div>`;
  return h}

  const p=curYM.split("-").map(Number),first=DS(p[0],p[1],1);
  return `<div class="grid2"><div><b>Avansuri</b><div class="list">${adv.map((x,i)=>`<div class="it"><span>${pad(x.d)}.${pad(p[1])}</span><span class="mono">${money(num(x.sum))} lei</span><span class="mut">${esc(x.note||"")}</span><span class="sp"></span>${confirmDel==="adv:"+e.id+":"+i?`<button class="btn r s" data-a="deladv" data-e="${e.id}" data-i="${i}">Sigur? Șterge</button>`:`<button class="btn g s" data-a="ask" data-k="adv:${e.id}:${i}">Șterge</button>`}</div>`).join("")||'<div class="mut">niciun avans</div>'}</div>

/* ============ evenimente ============ */
function onClick(ev){const b=ev.target.closest("button,input[type=checkbox]");if(!b)return;
  if(b.closest("nav")){tab=b.dataset.t;confirmDel=null;sheetEmp=null;render();window.scrollTo(0,0);return}
  const a=b.dataset.a;if(!a||b.tagName==="INPUT"&&b.type==="checkbox"&&ev.type==="click"&&a!=="x"&&false)return;
  const e=b.dataset.e;
  switch(a){
   case"day":curDay=addDays(curDay,+b.dataset.n);render();break;
   case"gotoday":curDay=b.dataset.d;render();break;
   case"today":curDay=todayStr();render();break;
   case"allP":S.emps.filter(x=>worksOn(x,curDay)).forEach(x=>{if(!eff(x.id,curDay).s)markQuiet(x.id,curDay,"P")});saveMonth(curDay.slice(0,7));render();break;
   case"mark":sheetEmp=null;toggleMark(e,curDay,b.dataset.c);break;
   case"unmark":{const cur=eff(e,curDay);sheetEmp=null;if(cur.s&&cur.src!=="l")toggleMark(e,curDay,cur.s);else render();break}
   case"who":sheetEmp=e;render();break;
   case"sheetx":sheetEmp=null;render();break;
   case"tab":tab=b.dataset.t;confirmDel=null;render();window.scrollTo(0,0);break;
   case"depon":{const on=b.checked;const emp=S.emps.find(x=>x.id===e);setDep(e,curDay,on,num(emp&&emp.diurna)||num(S.diurna),"");break}
   case"cell":{const cur=eff(e,b.dataset.d),order=["","P","A","CO","CM","CFP"];let i=order.indexOf(cur.src==="m"?cur.s:"");if(cur.src==="l"&&!cur.s)i=0;
      const nxt=order[(i+1)%order.length];setMark(e,b.dataset.d,nxt);break}
   case"ym":{const p=curYM.split("-").map(Number);const t=new Date(p[0],p[1]-1+ +b.dataset.n,1);curYM=t.getFullYear()+"-"+pad(t.getMonth()+1);openEmp=null;render();break}
   case"tr":tr=b.dataset.v;render();break;
   case"open":openEmp=openEmp===e?null:e;render();break;
   case"paid":{const m=monthDoc(curYM);m.paid[e]=m.paid[e]||{};m.paid[e]["t"+tr]=b.checked;saveMonth(curYM);break}
   case"addadv":{const d=$("#advd").value,s=num($("#advs").value);if(!d||!s||d.slice(0,7)!==curYM){toast("Alege o dată din luna "+curYM+" și o sumă");return}
      const m=monthDoc(curYM);m.adv[e]=(m.adv[e]||[]).concat([{d:+d.slice(8),sum:r2(s),note:$("#advn").value.trim()}]).sort((x,y)=>x.d-y.d);saveMonth(curYM);render();break}
   case"addadv2":{const e2=$("#av_e").value,k=$("#av_k").value==="sup"?"sup":"adv",d=$("#av_d").value,s=num($("#av_s").value);if(!e2||!d||!s||d.slice(0,7)!==curYM){toast("Alege omul, o dată din luna afișată și suma");return}
      const m=monthDoc(curYM);m[k][e2]=(m[k][e2]||[]).concat([{d:+d.slice(8),sum:r2(s),note:$("#av_n").value.trim()}]).sort((x,y)=>x.d-y.d);saveMonth(curYM);render();toast(k==="adv"?"Avans adăugat":"Suplimentar adăugat");break}
   case"delent":{const m=monthDoc(curYM),k=b.dataset.k==="sup"?"sup":"adv";(m[k][e]||[]).splice(+b.dataset.i,1);confirmDel=null;saveMonth(curYM);render();break}
   case"deladv":{const m=monthDoc(curYM);m.adv[e].splice(+b.dataset.i,1);confirmDel=null;saveMonth(curYM);render();break}
   case"adddep":{const d=$("#depd").value,s=num($("#deps").value);if(!d||d.slice(0,7)!==curYM){toast("Alege o dată din luna "+curYM);return}
      const m=monthDoc(curYM),dd=+d.slice(8);m.dep[e]=(m.dep[e]||[]).filter(x=>x.d!==dd).concat([{d:dd,sum:r2(s),loc:$("#depl").value.trim()}]).sort((x,y)=>x.d-y.d);saveMonth(curYM);render();break}
   case"deldep":{const m=monthDoc(curYM);m.dep[e].splice(+b.dataset.i,1);confirmDel=null;saveMonth(curYM);render();break}
   case"addl":addLeave();break;

    Object.keys(r.docs).forEach(p=>applyDoc(p,r.docs[p]));
    normS();
    ready=true;render();store.start();
    if(r.offline)setSaveLbl(r.waiting?"se conectează… lucrezi pe datele păstrate pe acest aparat":"fără internet – lucrezi pe datele păstrate pe acest aparat",true);
  }catch(e){msg("Nu pot încărca datele: "+esc((e&&e.message)||e)+'<br><br><button class="btn" onclick="location.reload()">Încearcă din nou</button>')}
})();
</script>
</body>
